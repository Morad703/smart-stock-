spring.application.name=msClient

spring.config.import=${SPRING_CONFIG_IMPORT:optional:configserver:http://localhost:8888}

server.port=8086

spring.datasource.url=jdbc:mysql://localhost:3306/fournisseur_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}










