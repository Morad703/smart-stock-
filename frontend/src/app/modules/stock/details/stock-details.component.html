<div class="details-card" *ngIf="stock">
  <div class="header-actions">
    <button class="btn btn-back" (click)="router.navigate(['/stocks'])">
      <i class="fas fa-arrow-left"></i>
    </button>
    <h2>Détails du stock</h2>
  </div>

  <div class="details-layout">
    <div class="details-main">
      <form #stockDetailsForm="ngForm" class="form-grid">
        <div class="form-row">
          <label for="produit">Produit</label>
          <input id="produit" type="text" [value]="produitNom" disabled>
        </div>

        <div class="form-row">
          <label for="quantite">Quantité <span class="required">*</span></label>
          <input id="quantite" type="number" [(ngModel)]="stock.quantite"
                 name="quantite" [disabled]="!editMode" min="0" step="1" [class.error]="formErrors.quantite">
          <span class="error-message" *ngIf="formErrors.quantite">{{ formErrors.quantite }}</span>
        </div>

        <div class="form-row">
          <label for="seuilCritique">Seuil Critique <span class="required">*</span></label>
          <input id="seuilCritique" type="number" [(ngModel)]="stock.seuilCritique"
                 name="seuilCritique" [disabled]="!editMode" min="0" step="1" [class.error]="formErrors.seuilCritique">
          <span class="error-message" *ngIf="formErrors.seuilCritique">{{ formErrors.seuilCritique }}</span>
        </div>

        <div class="form-row">
          <label for="emplacement">Emplacement</label>
          <input id="emplacement" type="text" [(ngModel)]="stock.emplacement"
                 name="emplacement" [disabled]="!editMode" maxlength="100">
        </div>
      </form>

      <div class="form-actions">
        <button *ngIf="!editMode" class="btn btn-primary" (click)="activerModification()">
          <i class="fas fa-edit"></i> Modifier
        </button>

        <button *ngIf="editMode" class="btn btn-secondary" (click)="editMode = false; formErrors = {}">
          <i class="fas fa-times"></i> Annuler
        </button>

        <button *ngIf="editMode" class="btn btn-success" (click)="enregistrer(stockDetailsForm)">
          <i class="fas fa-save"></i> Enregistrer
        </button>
      </div>
    </div>

    <div class="details-sidebar">
      <!-- HISTORIQUE DES SORTIES -->
      <h3>Historique des sorties</h3>

  <table *ngIf="sorties.length > 0">
    <thead>
    <tr>
      <th>Date</th>
      <th>Quantité</th>
      <th>Raison</th>
    </tr>
    </thead>

    <tbody>
    <tr *ngFor="let s of sorties">
      <td>{{ s.dateSortie | date:'dd/MM/yyyy HH:mm' }}</td>
      <td>{{ s.quantite }}</td>
      <td>{{ s.raison }}</td>
    </tr>
    </tbody>
  </table>

      <p *ngIf="sorties.length === 0" class="empty">
        Aucune sortie effectuée pour ce stock.
      </p>
    </div>
  </div>
</div>
