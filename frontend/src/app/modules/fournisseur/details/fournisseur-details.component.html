<div class="details-card" *ngIf="fournisseur">
  <div class="header-actions">
    <button class="btn btn-back" (click)="router.navigate(['/fournisseurs'])">
      <i class="fas fa-arrow-left"></i>
    </button>
    <h2>Détails du fournisseur</h2>
  </div>

  <form #fournisseurDetailsForm="ngForm" class="form-grid">
    <div class="form-row">
      <label for="nom">Nom <span class="required">*</span></label>
      <input id="nom" type="text" [(ngModel)]="fournisseur.nom" name="nom" [disabled]="!editMode" [class.error]="formErrors.nom" maxlength="100">
      <span class="error-message" *ngIf="formErrors.nom">{{ formErrors.nom }}</span>
    </div>

    <div class="form-row">
      <label for="email">Email <span class="required">*</span></label>
      <input id="email" type="email" [(ngModel)]="fournisseur.email" name="email" [disabled]="!editMode" [class.error]="formErrors.email" maxlength="100">
      <span class="error-message" *ngIf="formErrors.email">{{ formErrors.email }}</span>
    </div>

    <div class="form-row">
      <label for="telephone">Téléphone</label>
      <input id="telephone" type="text" [(ngModel)]="fournisseur.telephone" name="telephone" [disabled]="!editMode" [class.error]="formErrors.telephone" maxlength="20" placeholder="Ex: 0123456789 (10 chiffres)" (blur)="validateForm()">
      <span class="error-message" *ngIf="formErrors.telephone">{{ formErrors.telephone }}</span>
    </div>

    <div class="form-row">
      <label for="adresse">Adresse</label>
      <input id="adresse" type="text" [(ngModel)]="fournisseur.adresse" name="adresse" [disabled]="!editMode" maxlength="200">
    </div>
  </form>

  <div class="form-actions">
    <button *ngIf="!editMode" class="btn btn-primary" (click)="activerModification()">
      <i class="fas fa-edit"></i> Modifier
    </button>

    <button *ngIf="editMode" class="btn btn-secondary" (click)="editMode = false; formErrors = {}">
      <i class="fas fa-times"></i> Annuler
    </button>

    <button *ngIf="editMode" class="btn btn-success" (click)="enregistrer(fournisseurDetailsForm)">
      <i class="fas fa-save"></i> Enregistrer
    </button>
  </div>
</div>
