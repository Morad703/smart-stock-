<div class="login-container">
  <div class="login-wrapper">
    <!-- Section gauche avec illustration -->
    <div class="login-illustration">
      <div class="illustration-content">
        <div class="illustration-icon">
          <i class="fas fa-boxes"></i>
        </div>
        <h1>Smart Stock</h1>
        <p class="illustration-text">Connectez-vous à votre plateforme de gestion de stock intelligente</p>
        <div class="features-list">
          <div class="feature-item">
            <i class="fas fa-check-circle"></i>
            <span>Gestion complète des stocks</span>
          </div>
          <div class="feature-item">
            <i class="fas fa-check-circle"></i>
            <span>Suivi en temps réel</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Section droite avec formulaire -->
    <div class="login-form-section">
      <div class="login-card">
        <div class="login-header">
          <h2>Connexion</h2>
          <p class="login-subtitle">Bienvenue de retour sur Smart Stock</p>
        </div>

        <form (ngSubmit)="login(); $event.preventDefault()" #loginForm="ngForm" class="login-form">
          <div class="general-error" *ngIf="generalError" [style.display]="generalError ? 'flex' : 'none'">
            <i class="fas fa-exclamation-circle"></i>
            <span>{{ generalError }}</span>
          </div>
          
          <div class="form-group">
            <label for="username">
              <i class="fas fa-user"></i>
              Nom d'utilisateur <span class="required">*</span>
            </label>
            <input
              id="username"
              type="text"
              [(ngModel)]="credentials.username"
              name="username"
              required
              placeholder="Entrez votre nom d'utilisateur"
              [class.error]="formErrors.username"
              [disabled]="isLoading">
            <span class="error-message" *ngIf="formErrors.username">{{ formErrors.username }}</span>
          </div>

          <div class="form-group">
            <label for="password">
              <i class="fas fa-lock"></i>
              Mot de passe <span class="required">*</span>
            </label>
            <input
              id="password"
              type="password"
              [(ngModel)]="credentials.password"
              name="password"
              required
              placeholder="Entrez votre mot de passe"
              [class.error]="formErrors.password"
              [disabled]="isLoading">
            <span class="error-message" *ngIf="formErrors.password">{{ formErrors.password }}</span>
          </div>

          <button type="submit" [disabled]="isLoading" class="login-btn">
            <span *ngIf="!isLoading">
              <i class="fas fa-sign-in-alt"></i>
              Se connecter
            </span>
            <span *ngIf="isLoading">
              <i class="fas fa-spinner fa-spin"></i>
              Connexion en cours...
            </span>
          </button>

          <div class="login-footer">
            <p>Pas encore de compte ? <a routerLink="/register">Créer un compte</a></p>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
